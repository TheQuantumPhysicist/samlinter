# - Workspace facts samlinter cannot derive from `cargo metadata`.
# - Every key but `exclude` is required; unknown keys are an error, so a typo cannot silently
#   skip a check.
# - No rule switches or severities: every finding fails the run.
# - Exemptions live at the violation, never here:
#   - Rust, every rule with findings in Rust source: rest_pattern, restricted_visibility,
#     item_order, item_spacing, fn_spacing, em_dash, emoji, forbidden_word,
#     library_subscriber, path_attr: #[cfg_attr(samlinter, expect(<rule>, reason = "<why>"))]
#   - Cargo.toml: [package.metadata.samlinter.expect.member_version] with <dependency> = "<why>"
#   - Any other rule, or a listed rule in the wrong kind of file, is a malformed_exemption.
#   - Comment findings in Cargo.toml, this file and README files cannot be exempted.

# - Words or phrases banned in comments (Rust, Cargo.toml, this file) and README files.
# - Case-sensitive, whole words only: "NOTES" does not match "KEYNOTES".
# - The words of a phrase match across any whitespace run, so a phrase wrapped across
#   lines or consecutive comment lines still matches.
forbidden-words = ["RULES.md", "CODEMAP.md", "HANDOFF.md", "TRACKS.md", "CLAUDE.md", "AI", "LLM"]

# - Crates that install a log subscriber.
# - Libraries only emit logs: in a package without a binary target that lists one as a
#   regular dependency, each install call in library code (`.init()`,
#   `set_global_default(..)`, any call so named) is a finding. Building layers there is fine.
# - `-` and `_` in a name match each other, as on crates.io.
subscriber-crates = ["tracing-subscriber"]

# - Optional: files and directories every rule is silenced for. For generated code only,
#   never to silence a finding in code people write.
# - Paths relative to the workspace root, written with `/`; a directory covers everything
#   below it. No globs.
# - An entry that is absolute, climbs above the root, names nothing or passes through a
#   symlink is an error.
# - A covered Rust file is never read, and its `mod` declarations are not followed.
# exclude = ["src/generated", "build/bindings.rs"]
